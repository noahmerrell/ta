<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: relative;
            text-align: center;
        }

        .centered-top {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: black;
            padding: 10px;
        }

        .centered-bottom {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="alex-safareli-VpXiFTUfkdE-unsplash.jpg" alt="city street with tall buildings" width="1000px">
        <h1 class="centered-top">Hello World!</h1>
        <h2 class="centered-bottom">This is some sample text.</h2>
    </div>
</body>
</html>
