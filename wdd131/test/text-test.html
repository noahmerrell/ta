<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Test</title>
</head>
<style>
    #home-parallax {
        /* The image used */
        background-image: url("alex-safareli-VpXiFTUfkdE-unsplash.jpg");
    }

    .parallax {
        /* Set a specific height */
        min-height: 500px;

        /* Create the parallax scrolling effect */
        background-attachment: fixed;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
    }

    body{
        min-height: 2000px;
    }

    #home-parallax h1 {
        color: black;
        text-align: center;
    }
</style>
<body>
    <div id="home-parallax" class="parallax">
        <h1 id="home-text">Home</h1>
    </div>
    <div>
        <img>
        <p>Text</p>
    </div>
</body>
</html>
